name: Release

# Manual release: you give the version, the job runs the release you used to run
# locally with `make release TAG=vX.Y.Z`, on a runner instead of in Docker.
#
# It builds the artifacts (make build), bumps the version (make tag), commits the
# bump and the built artifacts, tags that commit and pushes the tag (master is
# protected and is never pushed to: the commit only lives under the tag), then
# publishes the GitHub release with the artifacts attached.
#
# The release is published as a pre-release, so GitHub never labels it "latest".
# Once the artifacts are checked, edit the release and untick "Set as a
# pre-release" to promote it.
on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to release, format vX.Y.Z (e.g. v2.10.1). The tag must not exist yet.'
                required: true
                type: string

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            VERSION: ${{ inputs.version }}
        steps:
            -   uses: actions/checkout@v4
                with:
                    # Releases are always cut from master, whatever branch the
                    # workflow has been dispatched from.
                    ref: master
                    # Full history: the Debian changelog lists the commits since
                    # the previous tag (CURRENT_TAG in artifacts/Makefile).
                    fetch-depth: 0

            -   name: Check version
                run: |
                    make check-tag TAG="$VERSION"
                    if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
                        echo "::error::Tag $VERSION already exists"
                        exit 1
                    fi

            # The PHP version here does not drive the phar compatibility:
            # artifacts/phar/Makefile pins composer platform.php to 7.0,
            # so the phar keeps supporting PHP 7.0+ whatever runs the build.
            # Tests require PHP >= 7.1 (": void" hints), hence a modern PHP.
            -   name: Set up PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.3

            -   name: Install Composer dependencies
                run: composer install --no-interaction --prefer-dist --no-progress

            # debhelper (dh) is needed by dpkg-buildpackage for the .deb and
            # is not preinstalled on ubuntu-latest runners
            -   name: Install Debian packaging tools
                run: sudo apt-get update && sudo apt-get install -y --no-install-recommends debhelper

            # Before the build, unlike the `new_git_version` target which built
            # first: getVersion() and the Debian changelog are baked into the
            # phar and the .deb, so bumping afterwards shipped artifacts still
            # carrying the previous version.
            -   name: Bump version
                run: make tag TAG="$VERSION"

            -   name: Build artifacts
                run: make build

            # Same steps as the `new_git_version` target of the Makefile, inlined
            # because its commit message relies on the `semver` binary, which
            # only exists in the phpmetrics/releasing Docker image.
            -   name: Tag and push
                run: |
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git add .github/ISSUE_TEMPLATE/Bug_report.md .github/ISSUE_TEMPLATE/Feature_request.md src/functions.php doc/installation.md artifacts/* releases/*
                    git commit -m "releasing $VERSION"
                    git tag "$VERSION" -m "releasing $VERSION"
                    git push origin "$VERSION"

            -   name: Publish release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ env.VERSION }}
                    name: ${{ env.VERSION }}
                    prerelease: true
                    generate_release_notes: true
                    files: |
                        releases/phpmetrics.phar
                        releases/phpmetrics-linux-x86_64
                        releases/phpmetrics-linux-arm
                        releases/phpmetrics-macos-x86_64
                        releases/phpmetrics-macos-arm64
                        releases/phpmetrics-windows-x86_64.exe
                        releases/phpmetrics.deb
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
